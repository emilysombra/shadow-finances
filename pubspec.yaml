name: shadow_finances
description: "Aplicativo de finanças pessoais para residentes no Brasil."
# App, não pacote: nunca é publicado no pub.dev.
publish_to: 'none'

# versão+build: no Android, viram versionName e versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Antes de adicionar um pacote, confira a licença (compatível com a GPL-3.0)
# e a manutenção (ver "Código aberto e segurança" no CLAUDE.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Gera as classes de tradução a partir de lib/l10n/*.arb (ver l10n.yaml).
  generate: true
  # Inclui a fonte dos ícones Material (classe Icons).
  uses-material-design: true
