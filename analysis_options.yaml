# Análise estática (`make analyze`). Parte das regras recomendadas do Flutter
# e acrescenta as que transformam convenções do CLAUDE.md em erros do
# analisador, em vez de depender só de revisão.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  # Inferência de tipos mais rígida: nada de `dynamic` escondido.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Imports sempre `package:shadow_finances/...` (convenção do projeto).
    always_use_package_imports: true
    # dart:, package: e relativos em blocos separados e em ordem alfabética.
    directives_ordering: true
    # Uma Future esquecida esconde erros e corridas; use `await` ou
    # `unawaited(...)` para deixar claro que é de propósito.
    unawaited_futures: true
    discarded_futures: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_dynamic_calls: true
    only_throw_errors: true
    prefer_single_quotes: true
    unnecessary_lambdas: true
    use_named_constants: true
